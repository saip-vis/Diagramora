<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0B2545">
  <title>Page not found | Diagramora</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root { --navy:#0B2545; --ink:#13293D; --muted:#60758A; --page:#EAF1F8; --white:#fff; --border:#C9D5E1; --radius:14px; --ease:cubic-bezier(.2,.7,.2,1); }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; display:grid; place-items:center; padding:24px; background:var(--page); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; line-height:1.55; }
    main { width:min(600px,100%); padding:clamp(32px,6vw,60px); border:1px solid var(--border); border-radius:var(--radius); background:var(--white); box-shadow:0 16px 45px rgba(11,37,69,.12); text-align:left; }
    .mark { display:grid; place-items:center; width:42px; height:42px; border-radius:9px; background:var(--navy); color:#fff; font-weight:750; }
    .eyebrow { margin-top:30px; color:var(--muted); font-size:.78rem; font-weight:750; letter-spacing:.12em; text-transform:uppercase; }
    h1 { margin:8px 0 12px; color:var(--navy); font-size:clamp(2.2rem,7vw,3.8rem); line-height:1.05; letter-spacing:-.045em; }
    p { margin:0 0 26px; color:var(--muted); font-size:1.05rem; }
    a { display:inline-flex; min-height:46px; align-items:center; padding:0 18px; border:1px solid var(--navy); border-radius:9px; background:var(--navy); color:#fff; font-weight:700; text-decoration:none; transition:transform 160ms var(--ease),background 160ms var(--ease); }
    a:hover { transform:translateY(-2px); background:#163b65; }
    a:focus-visible { outline:3px solid rgba(40,95,143,.35); outline-offset:3px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">V→</div>
    <div class="eyebrow">Error 404</div>
    <h1>This page isn’t here.</h1>
    <p>The address may be incorrect, or the page may have moved. Your saved designs have not been affected.</p>
    <a href="/">Return home</a>
  </main>
</body>
</html>
